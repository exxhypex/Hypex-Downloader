name: HYPEX Downloader CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing keys
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \\
              -storepass android -alias androiddebugkey -keypass android \\
              -keyalg RSA -keysize 2048 -validity 10000 \\
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            PASS="hypex-ci-build-pass"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \\
              -storepass "$PASS" -alias upload -keypass "$PASS" \\
              -keyalg RSA -keysize 2048 -validity 365 \\
              -dname "CN=HYPEX CI,O=HYPEX,C=US"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi

      - name: Test Python engine
        run: python -m unittest discover -s app/src/test/python -p "test_*.py" -v

      - name: Test, lint and build APKs
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
          --no-daemon

      - name: Upload build outputs and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hypex-build-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
