name: HYPEX Downloader Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python Engine Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python yt-dlp Engine Tests
        run: python3 -m unittest discover -s app/src/test/python -p "test_*.py" -v

  android-build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36.1 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" || \
            sdkmanager --channel=1 "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Keystore
        id: release_signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/release.jks"
            echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            CI_PASS="hypex-ci-build-pass"
            keytool -genkeypair -v -keystore "${{ runner.temp }}/ci-release.jks" \
              -storepass "$CI_PASS" -alias upload -keypass "$CI_PASS" \
              -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=HYPEX CI,O=HYPEX,C=US"
            echo "KEYSTORE_PATH=${{ runner.temp }}/ci-release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Debug & Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: hypex-downloader-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
